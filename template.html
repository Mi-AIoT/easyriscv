<!DOCTYPE html>

<head>
    <title>$title$</title>

    <script>
    (function() {
        const SUPPORTED_LANGUAGES = ['en', 'zh-CN'];
        let lang = null;
        try {
            lang = localStorage.getItem('easyriscv-lang');
        } catch (e) {}

        if (!lang) {
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang) {
                if (SUPPORTED_LANGUAGES.includes(browserLang)) {
                    lang = browserLang;
                } else {
                    const partialMatch = SUPPORTED_LANGUAGES.find(l => l.startsWith(browserLang.split('-')[0]));
                    if (partialMatch) {
                        lang = partialMatch;
                    }
                }
            }
        }

        const path = window.location.pathname;
        if (lang === 'zh-CN') {
            if (!path.endsWith('index-zh.html') && (path.endsWith('index.html') || path.endsWith('/') || !path.includes('.html'))) {
                const url = new URL(window.location.href);
                if (path.endsWith('index.html')) {
                    url.pathname = path.replace('index.html', 'index-zh.html');
                } else if (path.endsWith('/')) {
                    url.pathname = path + 'index-zh.html';
                } else {
                    url.pathname = path.substring(0, path.lastIndexOf('/') + 1) + 'index-zh.html';
                }
                window.location.replace(url.toString());
            }
        } else {
            if (path.endsWith('index-zh.html')) {
                const url = new URL(window.location.href);
                url.pathname = path.replace('index-zh.html', 'index.html');
                window.location.replace(url.toString());
            }
        }
    })();
    </script>

    <script type="module" src="easyriscv.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <header class="page-banner">
        $title$
        <div id="language-switcher">
            <select id="lang-select" onchange="changeLanguage(this.value)">
            </select>
        </div>
    </header>

    <p>(Last updated: $date$)</p>

    <nav class="table-of-contents">
        $table-of-contents$
    </nav>

$body$
<script type="module">
import { setLanguage, getCurrentLanguage, getSupportedLanguages } from './i18n/i18n.js';

const LANGUAGE_NAMES = {
    'en': 'English',
    'zh-CN': '中文'
};

window.changeLanguage = async function(nextLang) {
    const current = getCurrentLanguage();
    if (nextLang === current) return;

    await setLanguage(nextLang);

    const url = new URL(window.location.href);
    const path = url.pathname;

    if (nextLang === 'zh-CN') {
        if (path.endsWith('index.html')) {
            url.pathname = path.replace('index.html', 'index-zh.html');
        } else if (path.endsWith('/')) {
            url.pathname = path + 'index-zh.html';
        } else {
            url.pathname = path.substring(0, path.lastIndexOf('/') + 1) + 'index-zh.html';
        }
    } else {
        if (path.endsWith('index-zh.html')) {
            url.pathname = path.replace('index-zh.html', 'index.html');
        } else {
            url.pathname = path.substring(0, path.lastIndexOf('/') + 1) + 'index.html';
        }
    }

    window.location.href = url.toString();
};

// Populate options dynamically
const select = document.getElementById('lang-select');
if (select) {
    const current = getCurrentLanguage();
    const langs = getSupportedLanguages();
    select.innerHTML = '';
    for (const lang of langs) {
        const opt = document.createElement('option');
        opt.value = lang;
        opt.textContent = LANGUAGE_NAMES[lang] || lang;
        if (lang === current) {
            opt.selected = true;
        }
        select.appendChild(opt);
    }
}
</script>
</body>
